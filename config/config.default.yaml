# Linux Data Guardian — Default Configuration
app:
  name: "Linux Data Guardian"
  version: "2.0.0"
  enabled: true
  # Available profiles:
  #   balanced — blocks background package-manager downloads, everything else allowed
  #   strict   — only the focused app + allowlisted tools may open new connections
  #   off      — monitoring only, no firewall rules
  default_profile: "balanced"
  poll_interval_seconds: 5

hotspot:
  # NetworkManager connection UUID. Set with: data-guardian set-hotspot
  designated_uuid: ""
  designated_name: ""

quotas:
  # Daily limit in MB for metered (hotspot) traffic only. 0 = unlimited.
  daily_limit_mb: 1000
  # Monthly limit in MB for metered traffic only. 0 = unlimited.
  monthly_limit_mb: 25000
  # Billing cycle start day (1-28).
  billing_cycle_day: 1
  # Warn once per threshold per day.
  warning_thresholds: [80, 95]
  # "block_unapproved" (enforce) or "warn_only" (never block).
  action_on_exhaustion: "block_unapproved"
  # Upper bound for a single manual allowance grant.
  max_allowance_mb: 10000

approvals:
  apt: true
  pip: true
  npm: true
  cargo: true
  timeout_seconds: 60
  # "deny" or "allow" when no interactive session is available.
  timeout_action: "deny"

storage:
  db_path: "~/.local/share/linux-data-guardian/guardian.db"
  history_retention_days: 90
