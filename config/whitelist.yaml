# Linux Data Guardian — Whitelist / Strict-mode policy
#
# Strict mode allows new outbound connections ONLY from:
#   1. the process tree of the focused window, and
#   2. the process trees listed below.
# Everything else on the metered interface is dropped.
#
# If cgroup v2 delegation is unavailable, strict mode falls back to the TCP
# port allowlist at the bottom of this file.

strict_whitelist_processes:
  - opencode
  - antigravity

# Extra TCP ports allowed in the strict fallback (DNS/HTTP/HTTPS/SSH are
# always included by the firewall renderer).
strict_allowed_ports_tcp:
  - 22
  - 80
  - 443
